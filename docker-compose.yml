# Production stack for Film Club Lens.
# Implements activation modules 12 (public HTTPS origin) and 13 (PostgreSQL +
# multiple workers). Secrets come from a gitignored .env on the host.
#
#   cp .env.example .env
#   # set DOMAIN, POSTGRES_PASSWORD, APP_ENCRYPTION_KEY, ADMIN_EMAIL/PASSWORD
#   docker compose up -d --build --scale worker=2
#   npm run deploy:check
#
name: film-club-lens

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  TRUST_PROXY: "true"
  SECURE_COOKIES: "true"
  SEED_DEMO: "false"
  PUBLIC_BASE_URL: "https://${DOMAIN:?set DOMAIN to your public hostname}"
  APP_URL: "https://${DOMAIN:?set DOMAIN to your public hostname}"
  EXPOSE_DEMO_CREDENTIALS: "false"
  ADMIN_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL to your production administrator email}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a strong production password}"
  APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY - generate with npm run setup -- --generate-key}"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-filmclublens}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-filmclublens}"
  DATA_DIR: /app/data
  STORAGE_DIR: /app/storage

x-app-common: &app-common
  build: .
  env_file:
    - .env
  volumes:
    - app-data:/app/data
    - app-storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filmclublens}
      POSTGRES_USER: ${POSTGRES_USER:-filmclublens}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmclublens} -d ${POSTGRES_DB:-filmclublens}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Never publish Postgres to the internet. The app reaches it on the private network.

  app:
    <<: *app-common
    environment:
      <<: *app-environment
      WORKER_ENABLED: "false"
    expose:
      - "3000"

  worker:
    <<: *app-common
    # The API initializes the schema before workers attempt their own startup.
    depends_on:
      app:
        condition: service_healthy
    # The worker does not run an HTTP server and cannot use the image's API probe.
    healthcheck:
      disable: true
    command: ["node", "server/worker-standalone.js"]
    environment:
      <<: *app-environment
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: "2"
    # Scale with: docker compose up -d --scale worker=2
    # Conditional job claims prevent the same job being processed twice.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN to your public hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # One-shot: create/verify the schema and prove two workers cannot double-claim.
  #   docker compose run --rm db-bootstrap
  db-bootstrap:
    <<: *app-common
    profiles: ["tools"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["node", "scripts/db-bootstrap.mjs"]
    environment:
      <<: *app-environment
      WORKER_ENABLED: "false"
    restart: "no"

volumes:
  pgdata:
  app-data:
  app-storage:
  caddy-data:
  caddy-config:
